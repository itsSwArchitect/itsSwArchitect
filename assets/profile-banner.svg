<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">Abid Ali | OpenShift and Cloud Platform Engineering</title>
  <desc id="desc">A sleek dark navy banner with the name Abid Ali, expertise in OpenShift, DevOps, virtualization and AI research, and an abstract connected platform illustration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08111e"/>
      <stop offset="54%" stop-color="#0c2134"/>
      <stop offset="100%" stop-color="#12263f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#44dbc9"/>
      <stop offset="100%" stop-color="#6ea8ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#279bb9" stop-opacity=".17"/>
      <stop offset="100%" stop-color="#279bb9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#97b4c7" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="softShadow" x="-30%" y="-50%" width="170%" height="210%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000812" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1400" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1400" height="360" rx="22" fill="url(#grid)"/>
  <ellipse cx="1154" cy="162" rx="440" ry="310" fill="url(#glow)"/>
  <path d="M 0 345 Q 530 320 750 358" stroke="#2ac3c4" stroke-width="2" fill="none" opacity=".34"/>
  <path d="M 795 0 Q 1060 150 1400 10" stroke="#87a6f1" stroke-width="1.4" fill="none" opacity=".19"/>
  <rect x="50" y="45" width="6" height="272" rx="3" fill="url(#accent)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="91" y="84" font-size="19" font-weight="700" letter-spacing="4.2" fill="#50d9ca">PLATFORM ENGINEERING  /  APPLIED AI</text>
    <text x="88" y="180" font-size="80" font-weight="800" letter-spacing="-2.1" fill="#f4f9fd">Abid Ali</text>
    <rect x="91" y="205" width="525" height="1.4" fill="#5f8097" opacity=".5"/>
    <text x="91" y="242" font-size="24" font-weight="600" fill="#e0ecf6">OPENSHIFT  •  CLOUD  •  DEVOPS</text>
    <text x="91" y="279" font-size="20" fill="#a9c3d2">Virtualization  /  Reliability  /  AI Research</text>
    <text x="91" y="317" font-size="15" letter-spacing="2" fill="#7ca6b8">BUILD  ·  AUTOMATE  ·  SECURE  ·  SCALE</text>
  </g>

  <!-- Right-side platform/network diagram; all elements are self-contained. -->
  <g transform="translate(790 30)">
    <path d="M280 75 L130 135 M280 75 L430 135 M130 135 L230 235 M430 135 L330 235 M230 235 L330 235"
          stroke="#3989ab" stroke-width="2" fill="none" stroke-dasharray="6 8" opacity=".55"/>
    <path d="M280 75 L280 245" stroke="#3fd5cd" stroke-width="2" stroke-dasharray="5 8" opacity=".45"/>

    <g filter="url(#softShadow)">
      <rect x="169" y="21" width="225" height="110" rx="18" fill="#122d42" stroke="#3bd9ca" stroke-opacity=".68" stroke-width="2"/>
      <path d="M198 77 l17 -28 h34 l17 28 -17 28 h-34 z" fill="none" stroke="#58e1d2" stroke-width="3"/>
      <path d="M215 49 l34 56 M249 49 l-34 56 M198 77 h68" stroke="#58e1d2" stroke-width="1.1" opacity=".4"/>
      <text x="285" y="65" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#eef8fb">PLATFORM</text>
      <text x="285" y="89" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9dc4d3">OPENSHIFT</text>
    </g>

    <g filter="url(#softShadow)">
      <rect x="35" y="148" width="200" height="77" rx="16" fill="#12293f" stroke="#5182b5" stroke-width="1.4"/>
      <circle cx="63" cy="187" r="10" fill="#56d8c9"/>
      <path d="M63 172 v30 M48 187 h30" stroke="#18394b" stroke-width="2.5"/>
      <text x="87" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#e8f3fb">AUTOMATION</text>
      <text x="87" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#a2c0d4">IaC / CI-CD</text>
    </g>
    <g filter="url(#softShadow)">
      <rect x="325" y="148" width="208" height="77" rx="16" fill="#12293f" stroke="#5182b5" stroke-width="1.4"/>
      <path d="M343 196 l13 -12 12 7 17 -19" stroke="#78b1ff" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="399" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#e8f3fb">RELIABILITY</text>
      <text x="399" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#a2c0d4">Monitor / Recover</text>
    </g>
    <g filter="url(#softShadow)">
      <rect x="164" y="258" width="232" height="56" rx="15" fill="#12293f" stroke="#5182b5" stroke-width="1.4"/>
      <circle cx="192" cy="286" r="9" fill="none" stroke="#a3abff" stroke-width="2.5"/>
      <circle cx="192" cy="286" r="3.2" fill="#a3abff"/>
      <text x="215" y="291" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#e8f3fb">AI / RESEARCH</text>
    </g>
    <circle cx="280" cy="75" r="4.5" fill="#59d8ce"/>
    <circle cx="130" cy="135" r="4.5" fill="#7aaeff"/>
    <circle cx="430" cy="135" r="4.5" fill="#7aaeff"/>
    <circle cx="280" cy="246" r="4.5" fill="#59d8ce"/>
  </g>
</svg>
